name: DMG

# Builds HorizonNotch.dmg and publishes it as a GitHub release, so
# releases/latest/download/HorizonNotch.dmg is always the newest build.
# - push to main: release "v<MARKETING_VERSION>" is created, or its DMG
#   replaced if that version was already released,
# - a pushed v* tag: release for that tag,
# - run by hand (Actions → DMG): same as a push to main.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    # Liquid Glass needs the macOS 26 SDK (Xcode 26).
    runs-on: macos-26
    env:
      # Secrets cannot be tested in a step's `if`; expose whether one is set.
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      # Optional signing certificate from the secrets MACOS_CERT_P12 (base64)
      # and MACOS_CERT_PASSWORD:
      # - a self-signed one keeps every build signed the same way, so macOS
      #   keeps granted permissions (Accessibility …) across updates,
      # - a Developer ID plus APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD
      #   also notarizes, so the DMG opens without a Gatekeeper warning.
      # Without a certificate the build is ad hoc signed.
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # A Developer ID if there is one, otherwise the self-signed
          # certificate (not "valid" to macOS, so no -v here).
          # Lines look like: 1) <hash> "Name" (CSSMERR_TP_NOT_TRUSTED) – keep only Name.
          NAMES=$(security find-identity -p codesigning "$KEYCHAIN" | sed -nE 's/^[^"]*"([^"]+)".*$/\1/p')
          IDENTITY=$(echo "$NAMES" | grep -m1 "Developer ID Application" || true)
          [ -n "$IDENTITY" ] || IDENTITY=$(echo "$NAMES" | head -1)
          echo "Signing identity: $IDENTITY"
          if ! echo "$IDENTITY" | grep -q "Developer ID"; then
            # Self-signed: trust it for code signing so Xcode accepts it.
            /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -nokeys -passin pass:"$CERT_PASSWORD" -out "$RUNNER_TEMP/cert.pem"
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials ci --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
            echo "NOTARY_PROFILE=ci" >> "$GITHUB_ENV"
          fi
      - name: Build DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: HorizonNotch-dmg
          path: build/HorizonNotch.dmg

      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(xcodebuild -project HorizonNotch.xcodeproj -showBuildSettings -configuration Release 2>/dev/null \
              | awk '/ MARKETING_VERSION = / { print $3; exit }')
            TAG="v$VERSION"
          fi
          # What the app's updater reads: ".../releases/latest/download/latest.json".
          printf '{"version": "%s", "build": %s, "dmg": "https://github.com/%s/releases/download/%s/HorizonNotch.dmg"}\n' \
            "${TAG#v}" "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" "$TAG" > build/latest.json
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/HorizonNotch.dmg build/latest.json --clobber
          else
            gh release create "$TAG" build/HorizonNotch.dmg build/latest.json --target "$GITHUB_SHA" \
              --title "Horizon Notch ${TAG#v}" --generate-notes --latest
          fi
