name: DMG

# Builds HorizonNotch.dmg and publishes it as a GitHub release, so
# releases/latest/download/HorizonNotch.dmg is always the newest build.
# - push to main: release "v<MARKETING_VERSION>" is created, or its DMG
#   replaced if that version was already released,
# - a pushed v* tag: release for that tag,
# - run by hand (Actions → DMG): same as a push to main.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    # Liquid Glass needs the macOS 26 SDK (Xcode 26).
    runs-on: macos-26
    env:
      # Secrets cannot be tested in a step's `if`; expose whether one is set.
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      # Optional: with a Developer ID certificate and an app-specific
      # password stored as secrets, the DMG is signed and notarized and
      # opens without a Gatekeeper warning. Without them it is ad hoc signed.
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials ci --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
            echo "NOTARY_PROFILE=ci" >> "$GITHUB_ENV"
          fi
      - name: Build DMG
        run: ./scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: HorizonNotch-dmg
          path: build/HorizonNotch.dmg

      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(xcodebuild -project HorizonNotch.xcodeproj -showBuildSettings -configuration Release 2>/dev/null \
              | awk '/ MARKETING_VERSION = / { print $3; exit }')
            TAG="v$VERSION"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/HorizonNotch.dmg --clobber
          else
            gh release create "$TAG" build/HorizonNotch.dmg --target "$GITHUB_SHA" \
              --title "Horizon Notch ${TAG#v}" --generate-notes --latest
          fi
